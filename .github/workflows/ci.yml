name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: synapse, POSTGRES_PASSWORD: synapse, POSTGRES_DB: synapse }
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U synapse" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["56379:6379"]
    env:
      SYNAPSE_REQUIRE_DB: "1"
      SYNAPSE_TEST_ADMIN_URL: postgres://synapse:synapse@localhost:55432/postgres?sslmode=disable
      SYNAPSE_REDIS_URL: redis://localhost:56379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - name: format
        run: test -z "$(gofmt -l apps internal tests migrations packages)"
      - name: vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: unit + integration (race)
        run: go test -race -count=1 -timeout 15m ./internal/... ./tests/integration/... ./tests/e2e/...
      - name: build
        run: go build ./...

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [go, web]
    strategy:
      matrix: { app: [api, worker, scheduler] }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/docker/Dockerfile.go
          build-args: APP=${{ matrix.app }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: build web
        if: matrix.app == 'api'
        uses: docker/build-push-action@v6
        with: { context: ., file: deployments/docker/Dockerfile.web, push: false }
