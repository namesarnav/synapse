# Serves the UI and proxies the API, webhook ingress and WebSockets to the api service.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 8080;
  root /usr/share/nginx/html;

  location /api/ { proxy_pass http://api:8080; include /etc/nginx/synapse-proxy.conf; }
  location /hooks/ { proxy_pass http://api:8080; include /etc/nginx/synapse-proxy.conf; }
  location /ws/ {
    proxy_pass http://api:8080;
    include /etc/nginx/synapse-proxy.conf;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
  }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
