apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: synapse
spec:
  replicas: 3
  selector: { matchLabels: { app: worker } }
  template:
    metadata:
      labels: { app: worker }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8081", prometheus.io/path: /metrics }
    spec:
      # Longer than SYNAPSE_SHUTDOWN_TIMEOUT so in-flight tasks can finish or hand back their lease.
      terminationGracePeriodSeconds: 60
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: worker
          image: synapse-worker:latest
          imagePullPolicy: IfNotPresent
          ports: [{ name: ops, containerPort: 8081 }]
          envFrom:
            - configMapRef: { name: synapse-config }
            - secretRef: { name: synapse-secrets }
          env:
            - { name: SYNAPSE_WORKER_ID, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
          readinessProbe: { httpGet: { path: /health/ready, port: ops }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health/live, port: ops }, periodSeconds: 10 }
          resources: { requests: { cpu: 250m, memory: 128Mi }, limits: { memory: 512Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
---
# Workers are stateless, so scaling on CPU is safe: a killed pod's leases expire and are re-queued.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker
  namespace: synapse
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: worker }
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
  behavior:
    scaleDown: { stabilizationWindowSeconds: 300 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker
  namespace: synapse
spec:
  minAvailable: 1
  selector: { matchLabels: { app: worker } }
