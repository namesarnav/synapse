apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: synapse
spec:
  replicas: 2
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      containers:
        - name: web
          image: synapse-web:latest
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /, port: http }, periodSeconds: 15 }
          resources: { requests: { cpu: 25m, memory: 32Mi }, limits: { memory: 128Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: synapse
spec:
  selector: { app: web }
  ports: [{ name: http, port: 80, targetPort: http }]
