# Full stack: docker compose up -d --build   (UI on http://localhost:8088)
x-go-env: &go-env
  SYNAPSE_ENV: prod
  SYNAPSE_DATABASE_URL: postgres://synapse:synapse@postgres:5432/synapse?sslmode=disable
  SYNAPSE_REDIS_URL: redis://redis:6379/0
  SYNAPSE_MASTER_KEY: ${SYNAPSE_MASTER_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318

services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: synapse, POSTGRES_PASSWORD: synapse, POSTGRES_DB: synapse }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U synapse"], interval: 3s, timeout: 3s, retries: 20 }
  redis:
    image: redis:7-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 3s, timeout: 3s, retries: 20 }
  api:
    build: { context: ., dockerfile: deployments/docker/Dockerfile.service, args: { APP: api } }
    environment:
      <<: *go-env
      SYNAPSE_RUN_SCHEDULER: "false"
      SYNAPSE_PUBLIC_URL: http://localhost:8088
    ports: ["8080:8080"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
  scheduler:
    build: { context: ., dockerfile: deployments/docker/Dockerfile.service, args: { APP: scheduler } }
    environment: *go-env
    depends_on: [api]
  worker:
    build: { context: ., dockerfile: deployments/docker/Dockerfile.service, args: { APP: worker } }
    environment: *go-env
    deploy: { replicas: 3 }
    depends_on: [api]
  web:
    build: { context: ., dockerfile: deployments/docker/Dockerfile.web }
    ports: ["8088:8080"]
    depends_on: [api]
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes: [./deployments/docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment: { COLLECTOR_OTLP_ENABLED: "true" }
    ports: ["16686:16686"]

volumes:
  pgdata:
